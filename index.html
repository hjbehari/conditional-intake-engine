<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Confidential Intake Engine</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; margin: 20px; color: #111; }
    .hidden { display: none !important; }
    .cards { display: flex; gap: 12px; flex-wrap: wrap; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; width: 220px; cursor: pointer; transition: box-shadow .12s; }
    .card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.06); }
    .card.active { border-color: #0366d6; box-shadow: 0 6px 18px rgba(3,102,214,0.12); }
    .nav { margin-top: 16px; display:flex; gap:8px; align-items:center; }
    .error { color: #b00020; margin-top: 8px; }
    label { display:block; margin-top:10px; font-weight:600; }
    select, input[type="text"], textarea { width:100%; padding:8px; border-radius:6px; border:1px solid #ccc; margin-top:6px; box-sizing:border-box; }
    button { padding:10px 14px; border-radius:6px; border:none; background:#0366d6; color:#fff; cursor:pointer; }
    button.secondary { background: #e0e0e0; color:#111; }
  </style>
</head>
<body>
  <h1>Consultancy Intake</h1>

  <div id="step1Container">
    <!-- Step 1 will be rendered dynamically by renderStep1() -->
  </div>

  <div id="dynamic" class="hidden" aria-live="polite"></div>

  <div id="navigation" class="nav hidden" aria-hidden="true">
    <button id="backBtn" class="secondary">Back</button>
    <button id="changeTrackBtn" class="secondary">Change Track</button>
    <button id="nextBtn">Next</button>
  </div>

  <div id="status" role="status"></div>

  <script>
    // Google Apps Script Web App endpoint (to be used as text/plain to bypass preflight).
    const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbz5XRKfxRe750m9SjPCvQtd62wuL_XX3PHJbQHFh3cgPYTMSMMREDyXmU9gWCB3mFk/exec';

    // App-wide state
    const state = {
      currentStep: 0,
      track: null,
      branches: {}, // branch-specific form data
      // store references to dynamically-created containers (replaced to prevent stale listeners)
      domRefs: {
        step1Container: null,
        dynamic: null,
        navigation: null
      }
    };

    // Structured track configuration array for renderStep1()
    const TRACKS = [
      {
        id: 'growth-economics',
        title: 'Growth Economics',
        description: 'Scale efficiently with data-driven ad spend and acquisition strategy',
        badge: '📈'
      },
      {
        id: 'storefront-conversion',
        title: 'Storefront Conversion',
        description: 'Optimize storefronts and checkout experiences for conversion lift',
        badge: '🛍️'
      },
      {
        id: 'platform-engineering',
        title: 'Platform Engineering',
        description: 'Architect and implement reliable engineering solutions',
        badge: '🧩'
      },
      {
        id: 'ops-and-compliance',
        title: 'Ops & Compliance',
        description: 'Security, compliance and operational excellence',
        badge: '🔒'
      }
      // Add more tracks here as needed
    ];

    // Utilities
    function $(id) { return document.getElementById(id); }

    // Initialize references and boot
    function init() {
      state.domRefs.step1Container = $('step1Container');
      state.domRefs.dynamic = $('dynamic');
      state.domRefs.navigation = $('navigation');

      // Render initial Step 1 cards
      renderStep1();

      // Wire change track button (event delegated: present on page always)
      const changeTrackBtn = $('changeTrackBtn');
      if (changeTrackBtn) {
        changeTrackBtn.addEventListener('click', () => {
          // Explicitly hide dynamic container and nav, show step1
          clearState();
          // Recreate the step1 UI
          renderStep1();
        });
      }

      // Wire back and next buttons (delegated)
      const backBtn = $('backBtn');
      const nextBtn = $('nextBtn');
      if (backBtn) backBtn.addEventListener('click', onBack);
      if (nextBtn) nextBtn.addEventListener('click', onNext);

      // Status area is useful
      updateStatus('');
    }

    // Render Step 1 dynamically from TRACKS array
    function renderStep1() {
      // Replace the container to ensure no dangling listeners or mutated nodes
      const parent = state.domRefs.step1Container;
      if (!parent) return;
      const newContainer = document.createElement('div');
      newContainer.id = 'step1ContainerInner';

      const heading = document.createElement('h2');
      heading.textContent = 'Choose a service track';
      newContainer.appendChild(heading);

      const cards = document.createElement('div');
      cards.className = 'cards';
      cards.id = 'step1Cards';

      // For each configured track, create a card
      TRACKS.forEach(track => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('data-track-id', track.id);
        card.innerHTML = `
          <div style="font-size:20px">${escapeHtml(track.badge)} <strong>${escapeHtml(track.title)}</strong></div>
          <div style="font-size:13px; color:#555; margin-top:8px;">${escapeHtml(track.description)}</div>
        `;
        // Click binding
        card.addEventListener('click', () => {
          // Remove active from siblings
          Array.from(cards.children).forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          onTrackSelected(track);
        });
        cards.appendChild(card);
      });

      newContainer.appendChild(cards);

      // Replace the old content
      parent.innerHTML = '';
      parent.appendChild(newContainer);

      // Ensure dynamic area and navigation are hidden when at Step 1
      if (state.domRefs.dynamic) {
        state.domRefs.dynamic.classList.add('hidden');
      }
      if (state.domRefs.navigation) {
        state.domRefs.navigation.classList.add('hidden');
        state.domRefs.navigation.setAttribute('aria-hidden', 'true');
      }
      state.currentStep = 0;
      state.track = null;
      state.branches = {};
      updateStatus('');
    }

    // Escape helper to avoid accidental injection in innerHTML from config
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function(m) {
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;', "'":'&#39;'})[m];
      });
    }

    // When a track is selected from step1
    function onTrackSelected(track) {
      state.track = track;
      state.currentStep = 1;
      // Ensure branches reset as user moves into a new track
      state.branches = {};
      renderStepForTrack(track);
    }

    // Render dynamic steps depending on the track; replace dynamic container entirely
    function renderStepForTrack(track) {
      // Defensive checks
      if (!state.domRefs.dynamic) return;

      // Replace the dynamic container DOM node to remove previous handlers safely
      const oldDynamic = state.domRefs.dynamic;
      const newDynamic = oldDynamic.cloneNode(false); // shallow clone without children
      oldDynamic.parentNode.replaceChild(newDynamic, oldDynamic);
      state.domRefs.dynamic = newDynamic;

      // Show navigation
      if (state.domRefs.navigation) {
        state.domRefs.navigation.classList.remove('hidden');
        state.domRefs.navigation.setAttribute('aria-hidden', 'false');
      }

      // Build Step 2 UI (example, but guarded so track-specific renderers can be added)
      try {
        newDynamic.classList.remove('hidden');

        // Main step container
        const wrapper = document.createElement('div');
        wrapper.id = 'stepWrapper';

        const title = document.createElement('h2');
        title.textContent = `Track: ${track.title}`;
        wrapper.appendChild(title);

        // Generic input for "Service Name / Project"
        const nameLabel = document.createElement('label');
        nameLabel.textContent = 'Project or Service Name';
        wrapper.appendChild(nameLabel);
        const nameInput = document.createElement('input');
        nameInput.type = 'text';
        nameInput.id = 'serviceName';
        nameInput.placeholder = 'My Project Name';
        nameInput.value = state.branches.serviceName || '';
        nameInput.addEventListener('input', (e) => {
          state.branches.serviceName = e.target.value;
        });
        wrapper.appendChild(nameInput);

        // Depending on the track id, render step-specific fields
        if (track.id === 'growth-economics') {
          renderGrowthEconomicsFields(wrapper);
        } else if (track.id === 'storefront-conversion') {
          renderStorefrontFields(wrapper);
        } else if (track.id === 'platform-engineering') {
          renderPlatformEngineeringFields(wrapper);
        } else {
          // Generic fallback fields
          const info = document.createElement('p');
          info.textContent = 'Please describe your objectives and constraints.';
          wrapper.appendChild(info);
          const details = document.createElement('textarea');
          details.id = 'details';
          details.rows = 5;
          details.addEventListener('input', (e) => {
            state.branches.details = e.target.value;
          });
          wrapper.appendChild(details);
        }

        // Submission button
        const submitBtn = document.createElement('button');
        submitBtn.id = 'submitBtn';
        submitBtn.textContent = 'Submit';
        submitBtn.style.marginTop = '12px';
        submitBtn.addEventListener('click', onSubmit);
        wrapper.appendChild(submitBtn);

        // Error / success message area
        const msg = document.createElement('div');
        msg.id = 'formMessage';
        wrapper.appendChild(msg);

        newDynamic.appendChild(wrapper);
      } catch (err) {
        // Render a fallback UI and log
        console.error('Error rendering track UI: ', err);
        newDynamic.innerHTML = '<p>Something went wrong while preparing this track. Please click Change Track and try again.</p>';
      }
    }

    // Step-specific renderers (defensive: do nothing if wrapper missing)
    function renderGrowthEconomicsFields(wrapper) {
      if (!wrapper) return;
      // Monthly Ad Spend dropdown with full tiers
      const spendLabel = document.createElement('label');
      spendLabel.textContent = 'Monthly Ad Spend';
      wrapper.appendChild(spendLabel);

      const spendSelect = document.createElement('select');
      spendSelect.id = 'adSpend';
      const options = [
        {val:'<5k', text:'< $5k / month'},
        {val:'5k-15k', text:'$5k - $15k / month'},
        {val:'15k-50k', text:'$15k - $50k / month'},
        {val:'50k+', text:'$50k+ / month'}
      ];
      options.forEach(opt => {
        const o = document.createElement('option');
        o.value = opt.val;
        o.textContent = opt.text;
        spendSelect.appendChild(o);
      });
      spendSelect.value = state.branches.adSpend || options[0].val;
      spendSelect.addEventListener('change', (e) => {
        state.branches.adSpend = e.target.value;
      });
      wrapper.appendChild(spendSelect);

      // Advertising platforms multi-select / checkboxes
      const platformLabel = document.createElement('label');
      platformLabel.textContent = 'Primary Ad Platforms';
      wrapper.appendChild(platformLabel);

      const platformSelect = document.createElement('select');
      platformSelect.id = 'adPlatforms';
      ['Google Ads', 'Meta (Facebook/Instagram)', 'TikTok', 'LinkedIn', 'Programmatic/Other'].forEach(p => {
        const o = document.createElement('option');
        o.value = p;
        o.textContent = p;
        platformSelect.appendChild(o);
      });
      platformSelect.addEventListener('change', (e) => {
        // For brevity treat as single-select; could be extended to multi-select
        state.branches.adPlatform = e.target.value;
      });
      wrapper.appendChild(platformSelect);
    }

    function renderStorefrontFields(wrapper) {
      if (!wrapper) return;
      const platformLabel = document.createElement('label');
      platformLabel.textContent = 'Primary Storefront / Commerce Platform';
      wrapper.appendChild(platformLabel);

      const platformSelect = document.createElement('select');
      platformSelect.id = 'storefrontPlatform';
      const options = [
        {val:'shopify', text:'Shopify (Hosted SaaS)'},
        {val:'shopify-plus', text:'Shopify Plus (Enterprise)'},
        {val:'woocommerce', text:'WooCommerce (WordPress)'},
        {val:'bigcommerce', text:'BigCommerce'},
        {val:'magento', text:'Magento / Adobe Commerce'},
        {val:'custom', text:'Custom-built monolith'},
        {val:'headless', text:'Headless / Jamstack (e.g., Headless + Next/Vercel)'},
        {val:'other', text:'Other / Unsure'}
      ];
      options.forEach(opt => {
        const o = document.createElement('option');
        o.value = opt.val;
        o.textContent = opt.text;
        platformSelect.appendChild(o);
      });
      platformSelect.value = state.branches.storefrontPlatform || options[0].val;
      platformSelect.addEventListener('change', (e) => {
        state.branches.storefrontPlatform = e.target.value;
      });
      wrapper.appendChild(platformSelect);

      // Conversion priority radio or select
      const convLabel = document.createElement('label');
      convLabel.textContent = 'Primary conversion priority';
      wrapper.appendChild(convLabel);
      const convSelect = document.createElement('select');
      convSelect.id = 'convPriority';
      ['Homepage', 'Collection/Product pages', 'Checkout', 'Mobile UX', 'Other'].forEach(p => {
        const o = document.createElement('option');
        o.value = p.toLowerCase().replace(/\s+/g,'-');
        o.textContent = p;
        convSelect.appendChild(o);
      });
      convSelect.addEventListener('change', (e) => { state.branches.convPriority = e.target.value; });
      wrapper.appendChild(convSelect);
    }

    function renderPlatformEngineeringFields(wrapper) {
      if (!wrapper) return;
      const stackLabel = document.createElement('label');
      stackLabel.textContent = 'Primary Technology Stack';
      wrapper.appendChild(stackLabel);
      const stackInput = document.createElement('input');
      stackInput.type = 'text';
      stackInput.placeholder = 'e.g., Node.js, Ruby on Rails, Go, etc.';
      stackInput.value = state.branches.stack || '';
      stackInput.addEventListener('input', (e) => { state.branches.stack = e.target.value; });
      wrapper.appendChild(stackInput);

      const scaleLabel = document.createElement('label');
      scaleLabel.textContent = 'Current Scale / Traffic';
      wrapper.appendChild(scaleLabel);
      const scaleSelect = document.createElement('select');
      ['<10k users/month', '10k-100k', '100k-1M', '1M+'].forEach(t => {
        const o = document.createElement('option');
        o.value = t;
        o.textContent = t;
        scaleSelect.appendChild(o);
      });
      scaleSelect.addEventListener('change', (e) => { state.branches.scale = e.target.value; });
      wrapper.appendChild(scaleSelect);
    }

    // Navigation handlers
    function onBack() {
      // Simple behavior: go back to step1 by clearing state and render step1
      clearState();
      renderStep1();
    }

    function onNext() {
      // For this simple flow Next will focus the submit button; or move to next steps if more steps exist
      if (state.currentStep === 1) {
        // maybe advance to a review step; for brevity leave in step 1 renderer
        updateStatus('Proceed to fill details and click Submit.');
      }
    }

    // Clear state, purge branches and form inputs, hide dynamic and nav, and re-render step1
    function clearState() {
      // Purge business state
      state.track = null;
      state.branches = {};

      // Reset step index
      state.currentStep = 0;

      // Explicitly hide and replace dynamic container to remove listeners
      if (state.domRefs.dynamic) {
        try {
          state.domRefs.dynamic.classList.add('hidden');
          // Replace with a fresh container to guarantee no stale node references
          const fresh = document.createElement('div');
          fresh.id = 'dynamic';
          fresh.className = 'hidden';
          state.domRefs.dynamic.parentNode.replaceChild(fresh, state.domRefs.dynamic);
          state.domRefs.dynamic = fresh;
        } catch (err) {
          console.warn('Error while resetting dynamic container', err);
        }
      }

      // Hide navigation
      if (state.domRefs.navigation) {
        state.domRefs.navigation.classList.add('hidden');
        state.domRefs.navigation.setAttribute('aria-hidden', 'true');
      }

      // Recreate Step1 UI to ensure it is always available
      if (state.domRefs.step1Container) {
        // Re-render Step 1 to ensure initial cards are visible
        renderStep1();
      }

      // Clear any status messages
      updateStatus('');
    }

    // Submission: flatten payload and post as text/plain to GAS endpoint to avoid CORS preflight
    async function onSubmit(e) {
      e && e.preventDefault && e.preventDefault();

      // Basic checks
      const submitBtn = $('submitBtn');
      const msgArea = $('formMessage');
      if (!submitBtn) return;

      // Simple validation: ensure serviceName exists
      const serviceNameInput = $('serviceName');
      const serviceName = serviceNameInput ? serviceNameInput.value.trim() : (state.branches.serviceName || '');
      if (!serviceName) {
        if (msgArea) msgArea.innerHTML = '<div class="error">Please provide a project or service name.</div>';
        return;
      }

      // Prepare flat payload merging track info and branches
      const payload = {
        timestamp: new Date().toISOString(),
        trackId: state.track ? state.track.id : null,
        trackTitle: state.track ? state.track.title : null,
        serviceName: serviceName,
        // merge branch metadata (flatten)
        ...state.branches
      };

      // Update UI to indicate transmitting
      submitBtn.disabled = true;
      const prevText = submitBtn.textContent;
      submitBtn.textContent = 'Transmitting data...';
      if (msgArea) msgArea.innerHTML = '';

      try {
        // Use text/plain to bypass preflight for Google Apps Script endpoints that accept JSON in plain text
        const res = await fetch(GAS_ENDPOINT, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const txt = await res.text().catch(()=>null);
          throw new Error(`Server returned ${res.status} ${res.statusText}. ${txt || ''}`);
        }

        // Success
        if (msgArea) msgArea.innerHTML = '<div style="color:green">Submission received. Thank you.</div>';
        submitBtn.textContent = 'Submitted';
        submitBtn.disabled = true;

        // Optionally reset the UI after a short delay
        setTimeout(() => {
          clearState();
        }, 1200);

      } catch (err) {
        console.error('Submission failed', err);
        // Rollback UI: allow retry
        submitBtn.disabled = false;
        submitBtn.textContent = 'Retry';
        if (msgArea) msgArea.innerHTML = `<div class="error">Network error while submitting. Please check your connection and try again. (${escapeHtml(err.message || 'unknown')})</div>`;
      } finally {
        // ensure the button is not stuck disabled if we reset elsewhere
        // No-op here since above sets it appropriately
      }
    }

    // Helper for updating status area
    function updateStatus(msg) {
      const status = $('status');
      if (status) status.textContent = msg || '';
    }

    // Defensive guards for renderStepX functions if they are called and nodes missing
    // (This demo currently uses the one renderStepForTrack that internally calls the specific renderers)

    // Boot the app
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
